<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Dark Modern Card Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- IRDAI Registration Badge -->
  <g transform="translate(100, 100)">
    <rect width="280" height="44" rx="22" fill="#171717" stroke="#333333" stroke-width="1.5"/>
    <circle cx="26" cy="22" r="6" fill="#10b981"/>
    <text x="44" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ededed" letter-spacing="1">IRDAI REG. 2017342</text>
  </g>

  <!-- Brand Title -->
  <text x="100" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">Amrut Insurance</text>
  <text x="100" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" fill="#10b981">Certified Insurance Advisor • Surat, Gujarat</text>

  <!-- Tagline -->
  <text x="100" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#a3a3a3">Get the right insurance at the right price, with reliable support.</text>
  <text x="100" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#737373">Partner of 28+ Insurers • Health | Motor (TP &amp; Full) | Life | Commercial | Factory</text>

  <!-- Contact Bar -->
  <g transform="translate(100, 480)">
    <rect width="1000" height="70" rx="12" fill="#171717" stroke="#262626" stroke-width="1.5"/>
    <!-- Phone -->
    <text x="40" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">📞 +91 98241 39239</text>
    <!-- Location -->
    <text x="360" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#a3a3a3">📍 Shop No.123, Palika Bazar, Udhna, Surat</text>
    <!-- Instant Delivery -->
    <text x="820" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#10b981">⚡ 15-Min Policy PDF</text>
  </g>
</svg>
